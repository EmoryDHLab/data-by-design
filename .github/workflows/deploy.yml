name: Deploy

on:
  push:
    branches:
      - main
      - dev

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move deploy script
        run: |
          mv ./.github/workflows/deploy.sh .
          chmod +x deploy.sh

      - name: Run Deploy
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          DEV_REMOTE_PATH: ${{ secrets.DEV_REMOTE_PATH }}
          DEV_RESTART_COMMAND: ${{ secrets.DEV_RESTART_COMMAND }}
          PROD_REMOTE_PATH: ${{ secrets.PROD_REMOTE_PATH }}
          PROD_RESTART_COMMAND: ${{ secrets.PROD_RESTART_COMMAND }}
        run: ./deploy.sh
