<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracks</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.5.0/p5.min.js"></script>
  <style>
    @import url('/app.css');
    body {
      font-family: 'VTC Du Bois', serif;
    }
  </style>
</head>
<body style="margin: 0; padding: 0;">
  <script src="particle.js"></script>
  <script src="sketch.js"></script>
  <script>
    // Function to update text from parent
    window.updateTrackText = function(newText) {
      console.log('Updating track text:', newText);
      if (typeof mainText1 !== 'undefined') {
        mainText1 = newText;
        currentMainText = newText;
        // Force texture redraw by setting different values
        if (typeof textureUnit !== 'undefined') {
          textureUnit = textureUnit + 0.1;
        }
        if (typeof currentTextureUnit !== 'undefined') {
          currentTextureUnit = currentTextureUnit - 0.1;
        }
        console.log('Track text updated to:', mainText1);
      }
    };
    
    
    // Function to toggle straight text mode
    window.toggleStraightText = function() {
      if (typeof straightTextMode !== 'undefined') {
        straightTextMode = !straightTextMode;
      }
    };
  </script>
</body>
</html>
